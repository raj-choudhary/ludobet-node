<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ludo Classic — Live Match Play</title>
  <meta name="description" content="Live Ludo Classic 2-Player Battle Arena. Roll the dice, move pawns, capture opponent tokens, and win real prize pool!">
  <link rel="stylesheet" href="game-play.css">
</head>
<body>

  <!-- Main Game Play Container -->
  <div class="gameplay-container">
    <div class="gameplay-bg-pattern"></div>

    <!-- 1. TOP HEADER BAR -->
    <header class="top-header-bar">
      <!-- Menu Button -->
      <button class="btn-menu-dark" onclick="window.location.href='ludo-classic.html'" aria-label="Menu">
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>
      </button>

      <!-- Coins Pill -->
      <div class="res-pill-gold">
        <div class="res-content-left">
          <span class="res-coin-icon">🪙</span>
          <span class="res-number">25,350</span>
        </div>
        <button class="btn-plus-green" onclick="showToast('+500 Coins added!', '🪙')">+</button>
      </div>

      <!-- Gems Pill -->
      <div class="res-pill-gold">
        <div class="res-content-left">
          <span class="res-diamond-icon">💎</span>
          <span class="res-number">1,250</span>
        </div>
        <button class="btn-plus-green" onclick="showToast('+50 Diamonds added!', '💎')">+</button>
      </div>

      <!-- Bell Button -->
      <button class="btn-bell-dark" onclick="showToast('3 New Alerts', '🔔')" aria-label="Notifications">
        🔔
        <span class="bell-badge-red">3</span>
      </button>
    </header>

    <!-- 2. TOP CONTROLS & OPPONENT CARD ROW -->
    <div class="controls-top-row">
      <!-- Center-Left Gold Undo/Back Button -->
      <button class="btn-undo-gold" onclick="window.location.href='ludo-classic.html'" title="Return to Lobby">
        ↩
      </button>

      <!-- Opponent Player Card (Top-Right) -->
      <div class="player-game-card" id="player-card-bot">
        <div class="player-avatar-box">
          <svg class="pawn-avatar-icon" viewBox="0 0 36 36">
            <circle cx="18" cy="11" r="7" fill="#43a047" stroke="#ffffff" stroke-width="1.5"/>
            <path d="M11 31c0-7 3.5-12 7-12s7 5 7 12z" fill="#2e7d32" stroke="#ffffff" stroke-width="1.5"/>
            <ellipse cx="18" cy="30" rx="9" ry="3.5" fill="#1b5e20"/>
          </svg>
        </div>
        <div class="player-meta-box">
          <span class="player-title-name">Bot</span>
          <span class="player-id-sub">BOT_2088</span>
          <div class="player-score-pill">
            Score: <span class="player-score-val" id="score-val-bot">42</span>
          </div>
        </div>
        <!-- 3D Tumbling Animated Dice (Green / Bot) -->
        <div class="dice-gif-box" id="dice-box-green">
          <img id="dice-img-green" src="assets/dice_5.png" alt="Dice 5">
        </div>
      </div>
    </div>

    <!-- 3. THE 15x15 LUDO BOARD (Pixel-perfect background + Dynamic 3D Pawns) -->
    <div class="ludo-board-wrapper" id="ludo-board-wrapper">
      <!-- 3D Pawns dynamically rendered and positioned by ludo-engine.js -->
    </div>

    <!-- 4. BOTTOM USER CARD ROW -->
    <div class="controls-bottom-row">
      <!-- User Player Card (Bottom-Left) -->
      <div class="player-game-card active-turn" id="player-card-you">
        <div class="player-avatar-box blue">
          <svg class="pawn-avatar-icon" viewBox="0 0 36 36">
            <circle cx="18" cy="11" r="7" fill="#1e88e5" stroke="#ffffff" stroke-width="1.5"/>
            <path d="M11 31c0-7 3.5-12 7-12s7 5 7 12z" fill="#1565c0" stroke="#ffffff" stroke-width="1.5"/>
            <ellipse cx="18" cy="30" rx="9" ry="3.5" fill="#0d47a1"/>
          </svg>
        </div>
        <div class="player-meta-box">
          <span class="player-title-name">You</span>
          <span class="player-id-sub">YOU_1045</span>
          <div class="player-score-pill">
            Score: <span class="player-score-val" id="score-val-you">0</span>
          </div>
        </div>
        <!-- 3D Tumbling Animated Dice (Blue / You) -->
        <div class="dice-gif-box" id="dice-box-blue" onclick="handlePlayerDiceRoll()" title="Click to Roll Dice!">
          <img id="dice-img-blue" src="assets/dice_6.png" alt="Dice 6">
        </div>
      </div>
    </div>

    <!-- 5. TURN TIMER PROGRESS BAR -->
    <div class="turn-timer-container">
      <div class="turn-timer-bar" id="turn-timer-bar"></div>
    </div>

  </div>

  <!-- VICTORY POPUP MODAL -->
  <div class="modal-victory-backdrop" id="modal-game-victory">
    <div class="modal-victory-box">
      <div class="victory-trophy-icon">🏆</div>
      <h2 class="victory-title-text" id="victory-title">VICTORY!</h2>
      <p class="victory-sub-text" id="victory-sub">You won the match & claimed ₹36 Prize Pool!</p>
      <button class="btn-victory-action" onclick="closeVictoryModal()">RETURN TO LOBBY</button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-msg" id="toast-msg"></div>

  <!-- Game Engine Logic -->
  <script src="ludo-engine.js"></script>
</body>
</html>
